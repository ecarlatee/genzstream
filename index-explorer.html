<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>GenZstream · Architecture 4 : Explorateur & Filtres Instantanés</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
  <link rel="stylesheet" href="/assets/f3jcgis3.css" />
  <style>
    :root {
      --bg: #0c0d12;
      --card-bg: #141722;
      --border: rgba(255, 255, 255, 0.08);
      --accent-vf: #10b981;
      --accent-vostfr: #f59e0b;
      --accent-blue: #3b82f6;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Instrument Sans", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Switcher Bar */
    .style-switcher {
      background: #06070a;
      border-bottom: 1px solid var(--border);
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      overflow-x: auto;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .style-switcher span { color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .style-switcher a {
      color: var(--muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.04);
      transition: all 0.2s;
    }
    .style-switcher a:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .style-switcher a.active {
      background: var(--accent-vf);
      color: #000;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    /* Top Bar */
    .top-header {
      padding: 16px 32px;
      background: rgba(12, 13, 18, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }
    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 800;
    }
    .brand-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-vf);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Explorer Control Panel (Sticky Filter Bar) */
    .filter-panel {
      position: sticky;
      top: 31px;
      z-index: 90;
      background: rgba(12, 13, 18, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }
    .search-input-wrap {
      flex: 1;
      min-width: 260px;
      max-width: 450px;
      position: relative;
    }
    .search-input-wrap input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px 16px 10px 38px;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-input-wrap input:focus {
      border-color: var(--accent-vf);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-pill {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-pill:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .filter-pill.active {
      background: var(--accent-vf);
      color: #000;
      border-color: var(--accent-vf);
      font-weight: 700;
    }

    /* Grid Area */
    .grid-container {
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 32px 60px;
      flex: 1;
    }
    .results-count {
      margin-bottom: 20px;
      font-size: 14px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .explorer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }
    .media-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .media-card:hover {
      transform: translateY(-6px);
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 14px 28px rgba(0,0,0,0.6);
    }
    .card-poster {
      position: relative;
      padding-top: 145%;
      background: #111;
    }
    .card-poster img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge-wrap {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      gap: 4px;
    }
    .badge-item {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .badge-vf { background: var(--accent-vf); color: #000; }
    .badge-vostfr { background: var(--accent-vostfr); color: #000; }

    .card-info {
      padding: 12px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .card-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    /* Modal Player */
    .player-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }
    .player-modal.open { display: flex; }
    .player-modal-box {
      background: #141722;
      border-radius: 20px;
      width: 900px;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }
    .modal-frame-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }
    .modal-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Switcher Bar -->
  <div class="style-switcher">
    <span>Designs Disponibles :</span>
    <a href="/">Version Actuelle</a>
    <a href="/sidebar">1. Sidebar Rétractable</a>
    <a href="/hubs">2. Univers & Hubs</a>
    <a href="/bento">3. Bento Grid 2026</a>
    <a href="/explorer" class="active">4. Explorateur Filtres</a>
    <a href="/video">5. Video-First & PiP</a>
    <a href="/animes" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5; font-weight: 700; border: 1px solid rgba(239, 68, 68, 0.4);">🔥 100% Animé Sans Pub (/animes)</a>
  </div>

  <header class="top-header">
    <a href="/explorer" class="brand">
      <img src="/logo.png" alt="GenZstream" />
      <div>
        <div class="brand-title">GenZstream</div>
        <div class="brand-tag">Explorateur Instantané</div>
      </div>
    </a>
    <div style="font-size: 13px; color: var(--muted);">
      Contact Telegram : <a href="https://t.me/ec4rlate" target="_blank" style="color: var(--accent-vf); text-decoration: none; font-weight: 700;">t.me/ec4rlate</a>
    </div>
  </header>

  <!-- Filter & Controls Bar -->
  <div class="filter-panel">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="liveSearch" placeholder="Rechercher instantanément un titre..." oninput="handleSearch(this.value)" />
    </div>

    <!-- Language Filter -->
    <div class="filter-group">
      <button class="filter-pill active" onclick="setLangFilter('all', this)">Toutes langues</button>
      <button class="filter-pill" onclick="setLangFilter('vf', this)">🇫🇷 VF Uniquement</button>
      <button class="filter-pill" onclick="setLangFilter('vostfr', this)">🇯🇵 VOSTFR</button>
    </div>

    <!-- Category Filter -->
    <div class="filter-group">
      <button class="filter-pill active" onclick="setTypeFilter('all', this)">Tous</button>
      <button class="filter-pill" onclick="setTypeFilter('dragon_ball', this)">🐉 Dragon Ball (39)</button>
      <button class="filter-pill" onclick="setTypeFilter('animes', this)">⚡ Animés</button>
      <button class="filter-pill" onclick="setTypeFilter('movies', this)">🎬 Films</button>
    </div>
  </div>

  <main class="grid-container">
    <div class="results-count">
      <span id="resultsCount">Chargement du catalogue...</span>
      <span>Tri par pertinence & notes</span>
    </div>

    <div class="explorer-grid" id="explorerGrid">
      <!-- Media Cards injected by JavaScript -->
    </div>
  </main>

  <!-- Player Modal -->
  <div id="playerModal" class="player-modal">
    <div class="player-modal-box">
      <button class="modal-close" onclick="closePlayerModal()">✕</button>
      <div class="modal-frame-wrap">
        <iframe id="playerIframe" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
      </div>
      <div style="padding: 20px;">
        <h2 id="modalTitle" style="font-size: 20px; font-weight: 800; margin-bottom: 8px;"></h2>
        <div id="modalLinks" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
      </div>
    </div>
  </div>

  <script>
    let allItems = [];
    let activeLang = 'all';
    let activeType = 'all';
    let searchQuery = '';

    async function init() {
      try {
        const res = await fetch('/api/v1/browse');
        const data = await res.json();

        // Flatten all items deduplicated
        const map = new Map();
        (data.rows || []).forEach(r => {
          (r.items || []).forEach(it => {
            if (!map.has(it.tmdbId)) {
              it._isDb = r.key === 'dragon_ball' || (it.title && it.title.toLowerCase().includes('dragon ball'));
              map.set(it.tmdbId, it);
            }
          });
        });

        allItems = Array.from(map.values());
        applyFilters();
      } catch (e) {
        console.error(e);
      }
    }

    function setLangFilter(lang, btn) {
      activeLang = lang;
      btn.parentElement.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function setTypeFilter(type, btn) {
      activeType = type;
      btn.parentElement.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function handleSearch(val) {
      searchQuery = val.toLowerCase().trim();
      applyFilters();
    }

    function applyFilters() {
      let filtered = allItems;

      if (activeLang === 'vf') {
        filtered = filtered.filter(it => it.hasVf !== false);
      } else if (activeLang === 'vostfr') {
        filtered = filtered.filter(it => it.hasVf === false || (it.languages && it.languages.includes('VOSTFR')));
      }

      if (activeType === 'dragon_ball') {
        filtered = filtered.filter(it => it._isDb);
      } else if (activeType === 'animes') {
        filtered = filtered.filter(it => it.kind === 'animes' || it.mediaType === 'tv');
      } else if (activeType === 'movies') {
        filtered = filtered.filter(it => it.mediaType === 'movie');
      }

      if (searchQuery) {
        filtered = filtered.filter(it => it.title && it.title.toLowerCase().includes(searchQuery));
      }

      document.getElementById('resultsCount').textContent = `${filtered.length} œuvre(s) trouvée(s)`;

      const grid = document.getElementById('explorerGrid');
      grid.innerHTML = '';

      filtered.forEach(it => {
        const card = document.createElement('div');
        card.className = 'media-card';
        card.onclick = () => openPlayer(it);

        const hasVf = it.hasVf !== false;
        card.innerHTML = `
          <div class="card-poster">
            <img src="${it.posterPath || '/favicon.png'}" alt="${it.title}" loading="lazy" />
            <div class="badge-wrap">
              ${hasVf ? '<span class="badge-item badge-vf">VF</span>' : ''}
              <span class="badge-item badge-vostfr">VOSTFR</span>
            </div>
          </div>
          <div class="card-info">
            <div class="card-title">${it.title}</div>
            <div class="card-meta">
              <span>${it.releaseYear || ''}</span>
              <span>${it.mediaType === 'movie' ? 'Film' : (it.episodes ? it.episodes + ' ép.' : 'Série')}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function openPlayer(media) {
      const modal = document.getElementById('playerModal');
      const title = document.getElementById('modalTitle');
      const iframe = document.getElementById('playerIframe');
      const linksContainer = document.getElementById('modalLinks');

      title.textContent = media.title;
      iframe.src = '';
      linksContainer.innerHTML = '<div style="color: #9ca3af;">Chargement des sources...</div>';
      modal.classList.add('open');

      try {
        const res = await fetch(`/api/v1/media/${media.mediaType || 'tv'}/${media.tmdbId}/links?season=1&episodeId=1`);
        const data = await res.json();
        const links = data.links || [];

        linksContainer.innerHTML = '';
        links.forEach((l, idx) => {
          const btn = document.createElement('button');
          btn.style.cssText = 'background: #1e2235; color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;';
          btn.textContent = `▶ ${l.name}`;
          btn.onclick = async () => {
            const playRes = await fetch(`/api/v1/play/${l.id}`);
            const playData = await playRes.json();
            if (playData.url) iframe.src = playData.url;
          };
          linksContainer.appendChild(btn);

          if (idx === 0) btn.click();
        });
      } catch (e) {
        linksContainer.innerHTML = 'Erreur';
      }
    }

    function closePlayerModal() {
      document.getElementById('playerModal').classList.remove('open');
      document.getElementById('playerIframe').src = '';
    }

    init();
  </script>
</body>
</html>
