    <script>
      try {
        sessionStorage.clear();
        localStorage.clear();
      } catch (e) {}
      window.addEventListener('error', function(e) {
        try {
          fetch('/api/v1/client-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'uncaught', message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno, stack: e.error ? e.error.stack : null, url: location.href })
          }).catch(function(){});
        } catch(err){}
      });
      window.addEventListener('unhandledrejection', function(e) {
        try {
          fetch('/api/v1/client-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'unhandledrejection', reason: String(e.reason && e.reason.stack || e.reason), url: location.href })
          }).catch(function(){});
        } catch(err){}
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) r.unregister();
        });
        navigator.serviceWorker.register = function() {
          return Promise.reject(new Error('Service workers disabled'));
        };
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) caches.delete(name);
        });
      }
    </script>
