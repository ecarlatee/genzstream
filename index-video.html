<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>GenZstream · Architecture 5 : Video-First & Lecteur Flottant PiP</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
  <link rel="stylesheet" href="/assets/f3jcgis3.css" />
  <style>
    :root {
      --bg: #07080c;
      --card-bg: #12141d;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #ef4444; /* Video Red Accent */
      --accent-vf: #10b981;
      --text: #f9fafb;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Instrument Sans", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Switcher Bar */
    .style-switcher {
      background: #040507;
      border-bottom: 1px solid var(--border);
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      overflow-x: auto;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .style-switcher span { color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .style-switcher a {
      color: var(--muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.04);
      transition: all 0.2s;
    }
    .style-switcher a:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .style-switcher a.active {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
    }

    /* Header */
    .header {
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 8, 12, 0.9);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }
    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 800;
    }
    .brand-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Video Hero Player Stage */
    .stage-wrapper {
      max-width: 1200px;
      width: 100%;
      margin: 20px auto;
      padding: 0 20px;
    }
    .video-stage {
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      position: relative;
      transition: all 0.3s ease;
    }
    .player-aspect {
      width: 100%;
      aspect-ratio: 16/9;
      background: #050505;
      position: relative;
    }
    .player-aspect iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* PiP Floating Mode (activated on scroll) */
    .video-stage.pip-mode {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 360px;
      z-index: 1000;
      box-shadow: 0 20px 40px rgba(0,0,0,0.9);
      border-color: var(--accent);
    }
    .video-stage.pip-mode .stage-info {
      display: none;
    }

    .stage-info {
      padding: 20px 24px;
      background: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    .playing-title {
      font-size: 20px;
      font-weight: 800;
    }
    .playing-meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .sources-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .src-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .src-btn:hover, .src-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Catalogue Rows */
    .browse-section {
      max-width: 1400px;
      width: 100%;
      margin: 20px auto 60px;
      padding: 0 24px;
    }
    .row-block {
      margin-bottom: 36px;
    }
    .row-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .row-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(239, 68, 68, 0.4);
      box-shadow: 0 12px 28px rgba(0,0,0,0.6);
    }
    .poster-wrap {
      position: relative;
      padding-top: 145%;
      background: #111;
    }
    .poster-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card:hover .play-overlay { opacity: 1; }
    .play-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
    }
    .card-title {
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- Switcher Bar -->
  <div class="style-switcher">
    <span>Designs Disponibles :</span>
    <a href="/">Version Actuelle</a>
    <a href="/sidebar">1. Sidebar Rétractable</a>
    <a href="/hubs">2. Univers & Hubs</a>
    <a href="/bento">3. Bento Grid 2026</a>
    <a href="/explorer">4. Explorateur Filtres</a>
    <a href="/video" class="active">5. Video-First & PiP</a>
  </div>

  <header class="header">
    <a href="/video" class="brand">
      <img src="/logo.png" alt="GenZstream" />
      <div>
        <div class="brand-title">GenZstream</div>
        <div class="brand-tag">Video-First Continuous Streaming</div>
      </div>
    </a>
    <div style="font-size: 13px; color: var(--muted);">
      Support : <a href="https://t.me/ec4rlate" target="_blank" style="color: var(--accent); text-decoration: none;">t.me/ec4rlate</a>
    </div>
  </header>

  <div class="stage-wrapper" id="stageWrapper">
    <!-- Persistent Video Stage -->
    <div class="video-stage" id="videoStage">
      <div class="player-aspect">
        <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
      </div>
      <div class="stage-info">
        <div>
          <div class="playing-title" id="stageTitle">Dragon Ball Z · Épisode 1</div>
          <div class="playing-meta" id="stageMeta">VF Intégrale · 1080p HD</div>
        </div>
        <div class="sources-row" id="stageSources">
          <!-- Source buttons -->
        </div>
      </div>
    </div>
  </div>

  <main class="browse-section" id="browseSection">
    <!-- Injected by JavaScript -->
    <div style="text-align: center; color: var(--muted); padding: 40px;">Chargement du flux...</div>
  </main>

  <script>
    let browseData = null;

    async function init() {
      try {
        const res = await fetch('/api/v1/browse');
        browseData = await res.json();

        // Start with Dragon Ball Z or first item
        const dbRow = browseData.rows?.find(r => r.key === 'dragon_ball');
        const firstItem = (dbRow && dbRow.items && dbRow.items[0]) || (browseData.rows && browseData.rows[0]?.items?.[0]);

        if (firstItem) {
          playMedia(firstItem);
        }

        renderRows(browseData.rows || []);
        setupPipScroll();
      } catch (e) {
        console.error(e);
      }
    }

    async function playMedia(item) {
      document.getElementById('stageTitle').textContent = item.title;
      document.getElementById('stageMeta').textContent = `${item.releaseYear || 2024} · ${item.hasVf !== false ? 'Version Française (VF)' : 'VOSTFR'}`;

      const sourcesWrap = document.getElementById('stageSources');
      sourcesWrap.innerHTML = '<span style="font-size:12px;color:#9ca3af;">Recherche des flux...</span>';

      try {
        const res = await fetch(`/api/v1/media/${item.mediaType || 'tv'}/${item.tmdbId}/links?season=1&episodeId=1`);
        const data = await res.json();
        const links = data.links || [];

        sourcesWrap.innerHTML = '';
        links.forEach((l, idx) => {
          const btn = document.createElement('button');
          btn.className = `src-btn ${idx === 0 ? 'active' : ''}`;
          btn.textContent = l.name.replace('Lecteur ', 'L');
          btn.onclick = async () => {
            document.querySelectorAll('.src-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const playRes = await fetch(`/api/v1/play/${l.id}`);
            const playData = await playRes.json();
            if (playData.url) {
              document.getElementById('videoPlayer').src = playData.url;
            }
          };
          sourcesWrap.appendChild(btn);

          if (idx === 0) btn.click();
        });
      } catch (e) {
        sourcesWrap.innerHTML = 'Erreur';
      }
    }

    function renderRows(rows) {
      const main = document.getElementById('browseSection');
      main.innerHTML = '';

      rows.forEach(r => {
        const items = r.items || [];
        if (items.length === 0) return;

        const block = document.createElement('section');
        block.className = 'row-block';

        block.innerHTML = `
          <h2 class="row-title">
            <span>${r.key === 'dragon_ball' ? '🐉' : '🎬'}</span>
            ${r.title || (r.key === 'dragon_ball' ? 'Saga Dragon Ball Intégrale' : 'Tendances')}
          </h2>
          <div class="row-grid" id="grid_${r.key}"></div>
        `;

        main.appendChild(block);

        const grid = block.querySelector('.row-grid');
        items.forEach(it => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => {
            playMedia(it);
            // Smooth scroll back to top if not already at top
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          card.innerHTML = `
            <div class="poster-wrap">
              <img src="${it.posterPath || '/favicon.png'}" alt="${it.title}" loading="lazy" />
              <div class="play-overlay">
                <div class="play-circle">▶</div>
              </div>
            </div>
            <div class="card-title">${it.title}</div>
          `;
          grid.appendChild(card);
        });
      });
    }

    // When scrolling down, detach player to floating Picture-in-Picture
    function setupPipScroll() {
      const stage = document.getElementById('videoStage');
      const wrapper = document.getElementById('stageWrapper');

      window.addEventListener('scroll', () => {
        const rect = wrapper.getBoundingClientRect();
        if (rect.bottom < 100) {
          stage.classList.add('pip-mode');
        } else {
          stage.classList.remove('pip-mode');
        }
      });
    }

    init();
  </script>
</body>
</html>
