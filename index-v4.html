<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>GenZstream · Variante 4 : Accordéon In-Line Dépliable</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
  <link rel="stylesheet" href="/assets/f3jcgis3.css" />
  <style>
    :root {
      --color-fond: #0a0a0a;
      --color-fond2: #101010;
      --color-panneau: #161616;
      --color-panneau2: #1e1e1c;
      --color-bordure: #262626;
      --color-bordure-claire: #3a3a38;
      --color-doux: #a8a29a;
      --color-creme: #f0ead8;
      --color-vf: #10b981;
      --color-vostfr: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Instrument Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--color-fond);
      color: var(--color-creme);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Switcher de versions */
    .version-switch {
      background: #000;
      border-bottom: 1px solid var(--color-bordure);
      padding: 6px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      overflow-x: auto;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .version-switch span { color: var(--color-doux); font-weight: 700; text-transform: uppercase; }
    .version-switch a {
      color: var(--color-doux);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(240, 234, 216, 0.05);
      transition: all 0.2s;
    }
    .version-switch a:hover { background: rgba(240, 234, 216, 0.15); color: #fff; }
    .version-switch a.active {
      background: var(--color-creme);
      color: #000;
      font-weight: 700;
    }

    /* Top Navigation (Identique à l'actuel) */
    .top-nav {
      position: sticky;
      top: 31px;
      z-index: 100;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--color-bordure);
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .nav-left { display: flex; align-items: center; gap: 32px; }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--color-creme); }
    .nav-brand img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(240,234,216,0.25); }
    .nav-brand-title { font-size: 19px; font-weight: 800; }
    .nav-links { display: flex; align-items: center; gap: 20px; }
    .nav-link { color: var(--color-doux); text-decoration: none; font-size: 14px; font-weight: 500; }
    .nav-link:hover, .nav-link.active { color: var(--color-creme); font-weight: 600; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .search-bar {
      display: flex; align-items: center; gap: 10px; background: var(--color-fond2);
      border: 1px solid var(--color-bordure); padding: 7px 14px; border-radius: 9999px; width: 260px;
    }
    .search-bar input { background: transparent; border: none; color: var(--color-creme); font-size: 13px; outline: none; width: 100%; }

    /* Hero */
    .hero {
      position: relative;
      height: 440px;
      display: flex;
      align-items: flex-end;
      padding: 48px;
      background-size: cover;
      background-position: center 25%;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10,10,10,0.2) 0%, rgba(10,10,10,0.6) 60%, #0a0a0a 100%),
                  linear-gradient(90deg, rgba(10,10,10,0.9) 0%, transparent 100%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 650px; }
    .hero-title { font-size: 42px; font-weight: 900; line-height: 1.1; margin-bottom: 12px; }
    .hero-synopsis { font-size: 14px; line-height: 1.6; color: #d6d3cd; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Content Rails */
    .content-feed { padding: 30px 48px 60px; display: flex; flex-direction: column; gap: 40px; }
    .rail-block { position: relative; }
    .rail-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .rail-title { font-size: 20px; font-weight: 800; }
    .rail-slider { display: flex; gap: 16px; overflow-x: auto; scroll-behavior: smooth; padding: 6px 0 16px; scrollbar-width: none; }
    .rail-slider::-webkit-scrollbar { display: none; }
    .card { flex: 0 0 180px; background: var(--color-panneau); border: 1px solid var(--color-bordure); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.25s, border-color 0.25s; }
    .card:hover, .card.selected { transform: translateY(-6px); border-color: var(--color-creme); }
    .card-poster { position: relative; padding-top: 148%; }
    .card-poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 10px 12px; }
    .card-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* In-Line Accordion Expander (Directement sous la rangée cliquée) */
    .expander-box {
      margin-top: 16px;
      background: var(--color-panneau);
      border: 1px solid var(--color-bordure-claire);
      border-radius: 16px;
      overflow: hidden;
      display: none;
      animation: expandDown 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .expander-box.open { display: block; }
    @keyframes expandDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .expander-header {
      padding: 16px 24px;
      background: var(--color-panneau2);
      border-bottom: 1px solid var(--color-bordure);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .expander-body {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 24px;
      padding: 24px;
    }
    .expander-player-wrap {
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .expander-player-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .expander-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (max-width: 900px) {
      .expander-body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Switcher de versions -->
  <div class="version-switch">
    <span>Designs Disponibles :</span>
    <a href="/">Version Actuelle</a>
    <a href="/v1">Variante 1 : Pôles d'Univers & Rails</a>
    <a href="/v2">Variante 2 : Top 10 Numéroté & Multi-Hero</a>
    <a href="/v3">Variante 3 : Hero Panoramique & Épisodes 16:9</a>
    <a href="/v4" class="active">Variante 4 : Accordéon In-Line Dépliable</a>
  </div>

  <!-- Navbar -->
  <nav class="top-nav">
    <div class="nav-left">
      <a href="/v4" class="nav-brand">
        <img src="/logo.png" alt="GenZstream" />
        <span class="nav-brand-title">GenZstream</span>
      </a>
      <div class="nav-links">
        <a href="/v4" class="nav-link active">Accueil</a>
        <a href="/catalog" class="nav-link">Catalogue</a>
        <a href="/random" class="nav-link">Au hasard</a>
      </div>
    </div>
    <div class="nav-right">
      <div class="search-bar">
        <span>🔍</span>
        <input type="text" placeholder="Rechercher..." />
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero" id="heroBanner">
    <div class="hero-content">
      <h1 class="hero-title" id="heroTitle">Dragon Ball Z</h1>
      <p class="hero-synopsis" id="heroOverview">Synopsis...</p>
    </div>
  </section>

  <!-- Content Feed -->
  <main class="content-feed" id="railsContainer">
    <!-- Injected by JavaScript with expanders -->
  </main>

  <script>
    let browseData = null;

    async function init() {
      try {
        const res = await fetch('/api/v1/browse');
        browseData = await res.json();

        if (browseData.hero) {
          document.getElementById('heroTitle').textContent = browseData.hero.title;
          document.getElementById('heroOverview').textContent = browseData.hero.overview || '';
          if (browseData.hero.backdropPath) {
            document.getElementById('heroBanner').style.backgroundImage = `url('${browseData.hero.backdropPath}')`;
          }
        }

        renderRails();
      } catch (e) {
        console.error(e);
      }
    }

    function renderRails() {
      const container = document.getElementById('railsContainer');
      container.innerHTML = '';

      (browseData.rows || []).forEach((r, idx) => {
        const block = document.createElement('section');
        block.className = 'rail-block';
        const title = r.key === 'dragon_ball' ? '⚡ Saga Dragon Ball (39 Titres)' : (r.title || 'Tendances');

        block.innerHTML = `
          <div class="rail-head"><h2 class="rail-title">${title}</h2></div>
          <div class="rail-slider" id="v4_slider_${idx}"></div>
          <!-- In-Line Expander inserted directly under this rail -->
          <div class="expander-box" id="expander_${idx}">
            <div class="expander-header">
              <span id="exp_title_${idx}" style="font-weight: 800; font-size: 16px;"></span>
              <button onclick="closeExpander(${idx})" style="background:transparent; border:none; color:#fff; cursor:pointer; font-size:16px;">✕ Fermer</button>
            </div>
            <div class="expander-body">
              <div class="expander-player-wrap">
                <iframe id="exp_iframe_${idx}" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
              </div>
              <div class="expander-info">
                <p id="exp_desc_${idx}" style="font-size: 13px; color: var(--color-doux); line-height: 1.5;"></p>
                <div style="font-size: 13px; font-weight: 700; margin-top: 8px;">Lecteurs disponibles :</div>
                <div id="exp_sources_${idx}" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
              </div>
            </div>
          </div>
        `;
        container.appendChild(block);

        const slider = block.querySelector('.rail-slider');
        (r.items || []).forEach(it => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => openInLineExpander(idx, it);
          card.innerHTML = `
            <div class="card-poster"><img src="${it.posterPath || '/favicon.png'}" alt="${it.title}" loading="lazy" /></div>
            <div class="card-info"><div class="card-title">${it.title}</div></div>
          `;
          slider.appendChild(card);
        });
      });
    }

    async function openInLineExpander(railIdx, media) {
      // Close any other open expanders
      document.querySelectorAll('.expander-box').forEach(b => b.classList.remove('open'));

      const box = document.getElementById(`expander_${railIdx}`);
      const title = document.getElementById(`exp_title_${railIdx}`);
      const desc = document.getElementById(`exp_desc_${railIdx}`);
      const iframe = document.getElementById(`exp_iframe_${railIdx}`);
      const sources = document.getElementById(`exp_sources_${railIdx}`);

      title.textContent = media.title;
      desc.textContent = media.overview || 'Synopsis non renseigné.';
      iframe.src = '';
      sources.innerHTML = '<span style="font-size:12px;color:var(--color-doux);">Chargement...</span>';

      box.classList.add('open');
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      try {
        const res = await fetch(`/api/v1/media/${media.mediaType || 'tv'}/${media.tmdbId}/links?season=1&episodeId=1`);
        const data = await res.json();
        const links = data.links || [];

        sources.innerHTML = '';
        links.forEach((l, i) => {
          const btn = document.createElement('button');
          btn.style.cssText = 'background: #1e1e1c; color: #f0ead8; border: 1px solid #3a3a38; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;';
          btn.textContent = `▶ ${l.name}`;
          btn.onclick = async () => {
            const playRes = await fetch(`/api/v1/play/${l.id}`);
            const playData = await playRes.json();
            if (playData.url) iframe.src = playData.url;
          };
          sources.appendChild(btn);

          if (i === 0) btn.click();
        });
      } catch (e) {
        sources.innerHTML = 'Erreur';
      }
    }

    function closeExpander(railIdx) {
      const box = document.getElementById(`expander_${railIdx}`);
      box.classList.remove('open');
      document.getElementById(`exp_iframe_${railIdx}`).src = '';
    }

    init();
  </script>
</body>
</html>
